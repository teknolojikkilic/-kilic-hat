<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kılıç'a Ulaş</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #232a34;
    --text: #e8eaed;
    --muted: #8b95a3;
    --amber: #f0a742;
    --amber-dim: #7a5a24;
    --green: #3fb98a;
    --red: #e2604f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .device {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 24px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }
  .status-dot {
    position: absolute; top: 22px; right: 24px;
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted); letter-spacing: 0.5px;
  }
  .status-dot::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .header { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 68px; height: 68px; margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--amber), var(--amber-dim));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #1a1200;
  }
  .name { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Ekranlar */
  .screen { display: none; }
  .screen.active { display: block; animation: fade 0.35s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

  .prompt {
    text-align: center; font-size: 14px; color: var(--muted);
    margin-bottom: 22px; line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 16px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 18px;
    cursor: pointer; transition: all 0.2s;
    width: 100%; text-align: left; color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  .opt:active { transform: scale(0.97); border-color: var(--amber); }
  .opt .num {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 11px; background: rgba(240,167,66,0.12);
    color: var(--amber); font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .opt .label { font-weight: 500; }
  .opt .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .back {
    background: none; border: none; color: var(--muted);
    font-size: 13px; cursor: pointer; margin-top: 20px;
    display: block; margin-left: auto; margin-right: auto;
    font-family: inherit; padding: 8px;
  }

  /* Kayıt ekranı */
  .rec-circle {
    width: 120px; height: 120px; margin: 10px auto 24px;
    border-radius: 50%; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: all 0.3s;
  }
  .rec-circle.recording { border-color: var(--red); }
  .rec-circle.recording::after {
    content: ''; position: absolute; inset: -8px;
    border-radius: 50%; border: 2px solid var(--red);
    opacity: 0; animation: ring 1.5s infinite;
  }
  @keyframes ring { 0%{opacity:0.6; transform:scale(1)} 100%{opacity:0; transform:scale(1.25)} }
  .mic-icon { font-size: 44px; }
  .timer { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 6px; font-variant-numeric: tabular-nums; }

  /* Numara ekranı */
  .phone-input {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; color: var(--text);
    font-size: 18px; text-align: center; letter-spacing: 1px;
    font-family: inherit; margin-bottom: 16px;
  }
  .phone-input:focus { outline: none; border-color: var(--amber); }

  .btn {
    width: 100%; border: none; border-radius: 14px;
    padding: 16px; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-amber { background: var(--amber); color: #1a1200; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .btn + .btn { margin-top: 10px; }

  /* Sonuç ekranı */
  .result { text-align: center; padding: 16px 0; }
  .result .icon {
    width: 72px; height: 72px; margin: 0 auto 18px;
    border-radius: 50%; background: rgba(63,185,138,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .result h2 { font-size: 19px; margin-bottom: 8px; }
  .result p { font-size: 14px; color: var(--muted); line-height: 1.5; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 18px; opacity: 0.6; }
</style>
</head>
<body>
<div class="device">
  <div class="status-dot">ÇEVRİMİÇİ</div>

  <div class="header">
    <div class="avatar">K</div>
    <div class="name">Kılıç</div>
    <div class="sub">Otomatik karşılama hattı</div>
  </div>

  <!-- ANA MENÜ -->
  <div class="screen active" id="menu">
    <p class="prompt">Bir seçenek seç, hemen ileteyim.</p>
    <div class="options">
      <button class="opt" onclick="reminder()">
        <span class="num">1</span>
        <span><span class="label">Hatırlatma bırak</span><div class="desc">Kılıç'a "seni ara" bildirimi gider</div></span>
      </button>
      <button class="opt" onclick="show('record')">
        <span class="num">2</span>
        <span><span class="label">Sesli mesaj bırak</span><div class="desc">Sesini kaydet, doğrudan iletsin</div></span>
      </button>
      <button class="opt" onclick="show('callback')">
        <span class="num">3</span>
        <span><span class="label">Görüşmek istiyorum</span><div class="desc">Numaranı bırak, Kılıç seni arasın</div></span>
      </button>
    </div>
    <p class="hint">Ses internet üzerinden iletilir · ücretsiz</p>
  </div>

  <!-- SESLİ MESAJ -->
  <div class="screen" id="record">
    <div class="rec-circle" id="recCircle"><span class="mic-icon">🎙️</span></div>
    <div class="timer" id="timer">00:00</div>
    <p class="prompt" id="recHint">Kaydı başlatmak için butona bas.</p>
    <button class="btn btn-red" id="recBtn" onclick="toggleRec()">Kaydı başlat</button>
    <button class="btn btn-ghost" id="sendBtn" onclick="sendVoice()" style="display:none">Mesajı gönder</button>
    <button class="back" onclick="resetRec()">← Geri dön</button>
  </div>

  <!-- GERİ ARAMA -->
  <div class="screen" id="callback">
    <p class="prompt">Numaranı yaz, Kılıç en kısa sürede dönsün.</p>
    <input class="phone-input" id="phone" type="tel" inputmode="tel" placeholder="05XX XXX XX XX" maxlength="20">
    <button class="btn btn-amber" onclick="callback()">Gönder</button>
    <button class="back" onclick="show('menu')">← Geri dön</button>
  </div>

  <!-- SONUÇ -->
  <div class="screen" id="done">
    <div class="result">
      <div class="icon" id="doneIcon">✓</div>
      <h2 id="doneTitle">İletildi</h2>
      <p id="doneText">Kılıç bilgilendirildi.</p>
    </div>
    <button class="btn btn-ghost" onclick="show('menu')" style="margin-top:20px">Başa dön</button>
  </div>
</div>

<script>
  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function done(title, text, icon){
    document.getElementById('doneTitle').textContent = title;
    document.getElementById('doneText').textContent = text;
    document.getElementById('doneIcon').textContent = icon || '✓';
    show('done');
  }

  // 1 — Hatırlatma
  async function reminder(){
    try { await fetch('/api/reminder', {method:'POST'}); } catch(e){}
    done('Hatırlatma iletildi', 'Kılıç seni araması için bilgilendirildi.', '📌');
  }

  // 3 — Geri arama
  async function callback(){
    const phone = document.getElementById('phone').value.trim();
    if(phone.length < 7){ alert('Lütfen geçerli bir numara yaz.'); return; }
    try { await fetch('/api/callback', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone})}); } catch(e){}
    done('Kılıç seni arayacak', 'Numaran iletildi, en kısa sürede dönecek.', '📞');
  }

  // 2 — Ses kaydı
  let mediaRecorder, chunks = [], stream, seconds = 0, timerInt, audioBlob;

  async function toggleRec(){
    if(mediaRecorder && mediaRecorder.state === 'recording'){
      mediaRecorder.stop();
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
    } catch(e){
      alert('Mikrofon izni gerekli. Tarayıcı ayarlarından izin ver.');
      return;
    }
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      audioBlob = new Blob(chunks, {type:'audio/webm'});
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(timerInt);
      document.getElementById('recCircle').classList.remove('recording');
      document.getElementById('recBtn').style.display='none';
      document.getElementById('sendBtn').style.display='block';
      document.getElementById('recHint').textContent='Kaydı gönderebilir ya da geri dönüp yeniden kaydedebilirsin.';
    };
    mediaRecorder.start();
    seconds = 0;
    document.getElementById('recCircle').classList.add('recording');
    document.getElementById('recBtn').textContent='Durdur';
    document.getElementById('recHint').textContent='Konuş... bitince durdura bas.';
    timerInt = setInterval(()=>{
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      document.getElementById('timer').textContent = `${m}:${s}`;
      if(seconds >= 120) mediaRecorder.stop(); // maks 2 dk
    }, 1000);
  }

  async function sendVoice(){
    if(!audioBlob) return;
    document.getElementById('sendBtn').textContent = 'Gönderiliyor...';
    const fd = new FormData();
    fd.append('audio', audioBlob, 'mesaj.webm');
    try {
      await fetch('/api/voice', {method:'POST', body: fd});
      done('Sesli mesaj iletildi', 'Kılıç mesajını dinleyecek.', '🎙️');
    } catch(e){
      alert('Gönderilemedi, tekrar dene.');
      document.getElementById('sendBtn').textContent = 'Mesajı gönder';
    }
    resetRecState();
  }

  function resetRec(){
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    resetRecState();
    show('menu');
  }
  function resetRecState(){
    seconds = 0; audioBlob = null; chunks = [];
    clearInterval(timerInt);
    document.getElementById('timer').textContent = '00:00';
    document.getElementById('recCircle').classList.remove('recording');
    document.getElementById('recBtn').style.display='block';
    document.getElementById('recBtn').textContent='Kaydı başlat';
    document.getElementById('sendBtn').style.display='none';
    document.getElementById('recHint').textContent='Kaydı başlatmak için butona bas.';
  }
</script>
</body>
</html>
