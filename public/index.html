<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekran Paylaş</title>
<meta name="theme-color" content="#0d0f14">
<style>
  :root{
    --bg:#0d0f14; --panel:#161a22; --line:#262c38; --text:#e9edf3; --mute:#8b94a5;
    --accent:#4ade80; --accent-ink:#06210f; --danger:#f87171; --live:#ef4444;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  .brand{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
  .dot.on{background:var(--accent);box-shadow:0 0 0 4px rgba(74,222,128,.15)}
  .name{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
  .name input{background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 10px;width:140px;font:inherit}

  .hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .hero h1{margin:0 0 4px;font-size:22px}
  .hero p{margin:0;color:var(--mute);max-width:520px}
  .btn{padding:13px 20px;font-weight:650;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-danger{background:var(--danger);color:#2a0606}
  .btn-ghost{background:#1f2430;color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .note{color:var(--mute);font-size:13px;margin-top:10px}

  .mine{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:14px;gap:14px;align-items:center;flex-wrap:wrap}
  .mine.show{display:flex}
  .mine video{width:220px;max-width:100%;border-radius:10px;background:#000;aspect-ratio:16/9}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-weight:700;font-size:13px}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:p 1.4s infinite}
  @keyframes p{50%{opacity:.3}}

  h2{font-size:15px;color:var(--mute);font-weight:600;margin:26px 0 10px}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
    text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px}
  .card:hover{border-color:#3a4252}
  .card.active{border-color:var(--accent)}
  .card .who{font-weight:650}
  .card .meta{color:var(--mute);font-size:13px}
  .empty{color:var(--mute);background:var(--panel);border:1px dashed var(--line);
    border-radius:12px;padding:20px;text-align:center}

  /* İzleme ekranı */
  .viewer{display:none;margin-top:18px;background:#000;border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;position:relative}
  .viewer.show{display:block}
  .vbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .vbar .title{font-weight:650;margin-right:auto;padding-left:4px;display:flex;align-items:center;gap:10px}
  .vbar button{background:#1f2430;color:var(--text);border:1px solid var(--line);padding:7px 11px;font-size:13px}
  .vbar button.sel{border-color:var(--accent);color:var(--accent)}
  .stage{position:relative;height:min(72vh,720px);overflow:hidden;touch-action:none;cursor:grab;background:#000}
  .stage.drag{cursor:grabbing}
  .stage video,.stage img{position:absolute;left:50%;top:50%;transform-origin:center center;
    max-width:none;max-height:none;user-select:none;-webkit-user-drag:none}
  .status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--mute);pointer-events:none;text-align:center;padding:20px}
  .viewer:fullscreen .stage{height:calc(100vh - 52px)}
  .viewer.pseudo-fs{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;border:0;display:flex;flex-direction:column}
  .viewer.pseudo-fs .stage{flex:1;height:auto}
  body.noscroll{overflow:hidden}
  .vbar button:disabled{opacity:.4;cursor:not-allowed}
  .mode{color:var(--mute);font-size:12px;font-weight:500}
  .zoomval{color:var(--mute);font-size:12px;min-width:42px;text-align:center}
  @media (max-width:600px){
    .hero h1{font-size:19px}
    .stage{height:60vh}
    .name input{width:110px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span id="conn" class="dot"></span> Ekran Paylaş</div>
    <label class="name">Adın <input id="name" maxlength="30" placeholder="Misafir"></label>
  </header>

  <section class="hero">
    <div>
      <h1>Ekranını tek tıkla paylaş</h1>
      <p>Oda kodu yok. Paylaştığın an, bu siteyi açan herkes ekranını görür.</p>
      <div id="support" class="note"></div>
    </div>
    <button id="shareBtn" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 7v6M9 10l3-3 3 3"/></svg>
      Ekranımı Paylaş
    </button>
  </section>

  <section id="mine" class="mine">
    <video id="localVideo" autoplay muted playsinline></video>
    <div style="flex:1;min-width:180px">
      <div class="live">YAYINDA</div>
      <div id="viewerCount" style="margin:6px 0 10px;color:var(--mute)">0 kişi izliyor</div>
      <button id="stopBtn" class="btn btn-danger">Paylaşımı Durdur</button>
    </div>
  </section>

  <section id="viewer" class="viewer">
    <div class="vbar">
      <div class="title"><span class="live">CANLI</span><span id="watchName">—</span><span id="mode" class="mode"></span></div>
      <button data-fit="contain" class="sel" title="Ekrana sığdır">Sığdır</button>
      <button data-fit="cover" title="Ekranı doldur">Doldur</button>
      <button data-fit="actual" title="Gerçek boyut">1:1</button>
      <button id="zoomOut" title="Uzaklaş">−</button>
      <span id="zoomVal" class="zoomval">100%</span>
      <button id="zoomIn" title="Yakınlaş">+</button>
      <button id="soundBtn" title="Ses">🔇 Ses</button>
      <button id="fsBtn" title="Tam ekran">⛶ Tam ekran</button>
      <button id="closeBtn" title="Kapat">✕</button>
    </div>
    <div id="stage" class="stage">
      <video id="remoteVideo" autoplay playsinline muted></video>
      <img id="relayImg" alt="" draggable="false" style="display:none">
      <div id="vstatus" class="status">Bağlanıyor…</div>
    </div>
  </section>

  <h2>Şu an paylaşılan ekranlar</h2>
  <div id="list" class="list"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
